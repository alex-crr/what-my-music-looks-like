services:
  web:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data:ro # optional Deezer history from import_deezer.py; not in git, not in the image
    environment:
      # Read from .env next to this file. Empty if .env is missing: the app still starts and says so.
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_USER: ${LASTFM_USER:-}
